[package]
name = "chord-node"
version = "0.1.0"
edition = "2021"

[lib]
name = "chord_node"
path = "src/lib.rs"

[[bin]]
name = "chord_node"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
sha1 = "0.10"
axum = "0.7"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
tonic = "0.11"
prost = "0.12"
tonic-reflection = "0.11"

[build-dependencies]
tonic-build = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
