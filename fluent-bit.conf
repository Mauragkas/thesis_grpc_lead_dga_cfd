[SERVICE]
  Flush         5
  Log_Level     info
  Parsers_File  /fluent-bit/etc/parsers.conf

# Receive logs from Docker's fluentd logging driver
[INPUT]
  Name          forward
  Listen        0.0.0.0
  Port          24224

# Docker wraps your JSON log line in a "log" field.
# This filter parses that field back into structured JSON fields.
[FILTER]
  Name          parser
  Match         *
  Key_Name      log
  Parser        json
  Preserve_Key  true
  Reserve_Data  true

# Route by the tag set in each service's logging config
[OUTPUT]
  Name          kafka
  Match         lead.*
  Topics        logs.lead
  Brokers       kafka:9092
  Format        json

[OUTPUT]
  Name          kafka
  Match         orchestrator.*
  Topics        logs.orchestrator
  Brokers       kafka:9092
  Format        json

[OUTPUT]
  Name          kafka
  Match         worker.*
  Topics        logs.worker
  Brokers       kafka:9092
  Format        json

[OUTPUT]
  Name          kafka
  Match         surrogate.*
  Topics        logs.surrogate
  Brokers       kafka:9092
  Format        json
