[SERVICE]
  Flush         1
  Log_Level     info
  Parsers_File  /fluent-bit/etc/parsers.conf
  HTTP_Server   On
  HTTP_Listen   0.0.0.0
  HTTP_Port     2020
  Health_Check  On

# Fallback: Receive logs from Docker's fluentd logging driver if any service uses it
[INPUT]
  Name          forward
  Listen        0.0.0.0
  Port          24224

# Dual output file inputs: read JSON files written by containers
[INPUT]
  Name          tail
  Path          /var/log/app/orchestrator*.log
  Tag           orchestrator.file
  Parser        json
  Path_Key      file_path
  DB            /tmp/flb_orch.db
  Mem_Buf_Limit 5MB
  Skip_Long_Lines On
  Refresh_Interval 1

[INPUT]
  Name          tail
  Path          /var/log/app/worker*.log
  Tag           worker.file
  Parser        json
  Path_Key      file_path
  DB            /tmp/flb_worker.db
  Mem_Buf_Limit 5MB
  Skip_Long_Lines On
  Refresh_Interval 1

[INPUT]
  Name          tail
  Path          /var/log/app/lead*.log
  Tag           lead.file
  Parser        json
  Path_Key      file_path
  DB            /tmp/flb_lead.db
  Mem_Buf_Limit 5MB
  Skip_Long_Lines On
  Refresh_Interval 1

[INPUT]
  Name          tail
  Path          /var/log/app/surrogate*.log
  Tag           surrogate.file
  Parser        json
  Path_Key      file_path
  DB            /tmp/flb_surr.db
  Mem_Buf_Limit 5MB
  Skip_Long_Lines On
  Refresh_Interval 1

# Docker forward wraps stdout log lines in a "log" field.
# This filter parses that field back into structured JSON fields for forward inputs.
[FILTER]
  Name          parser
  Match         *.main
  Key_Name      log
  Parser        json
  Preserve_Key  true
  Reserve_Data  true

# Route by the tag set in each service's config to Kafka topics
[OUTPUT]
  Name          kafka
  Match         lead.*
  Topics        logs.lead
  Brokers       kafka:9092
  Format        json

[OUTPUT]
  Name          kafka
  Match         orchestrator.*
  Topics        logs.orchestrator
  Brokers       kafka:9092
  Format        json

[OUTPUT]
  Name          kafka
  Match         worker.*
  Topics        logs.worker
  Brokers       kafka:9092
  Format        json

[OUTPUT]
  Name          kafka
  Match         surrogate.*
  Topics        logs.surrogate
  Brokers       kafka:9092
  Format        json
