services:
  node1:
    build: .
    container_name: lead_node1
    environment:
      - RUST_LOG=info,lead_node=debug
      - HTTP_BIND=0.0.0.0:2001
      - GRPC_BIND=0.0.0.0:50051
      - SELF_URI=http://node1:50051
      - VIRTUAL_NODE_COUNT=100
      - LEAD_STORAGE_PATH=/data/lead
    volumes:
      - lead_node1_data:/data/lead
    ports:
      - "2001:2001"
      - "50051:50051"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:2001/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 128M
    networks:
      - lead-net

  node2:
    build: .
    container_name: lead_node2
    environment:
      - RUST_LOG=info,lead_node=debug
      - HTTP_BIND=0.0.0.0:2002
      - GRPC_BIND=0.0.0.0:50052
      - SELF_URI=http://node2:50052
      - JOIN_URI=http://node1:50051
      - VIRTUAL_NODE_COUNT=100
      - LEAD_STORAGE_PATH=/data/lead
    volumes:
      - lead_node2_data:/data/lead
    ports:
      - "2002:2002"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:2002/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 128M
    depends_on:
      node1:
        condition: service_healthy
    networks:
      - lead-net

  node3:
    build: .
    container_name: lead_node3
    environment:
      - RUST_LOG=info,lead_node=debug
      - HTTP_BIND=0.0.0.0:2003
      - GRPC_BIND=0.0.0.0:50053
      - SELF_URI=http://node3:50053
      - JOIN_URI=http://node1:50051
      - VIRTUAL_NODE_COUNT=100
      - LEAD_STORAGE_PATH=/data/lead
    volumes:
      - lead_node3_data:/data/lead
    ports:
      - "2003:2003"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:2003/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 128M
    depends_on:
      node1:
        condition: service_healthy
    networks:
      - lead-net

volumes:
  lead_node1_data:
  lead_node2_data:
  lead_node3_data:

networks:
  lead-net:
    driver: bridge
