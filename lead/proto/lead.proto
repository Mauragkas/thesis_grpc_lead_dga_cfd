syntax = "proto3";

package lead;

message NodeAddr { uint64 id = 1; string address = 2; }
message NodeIdMsg { uint64 id = 1; }
message VidMsg { uint64 vid = 1; }
message FindSuccRequest { uint64 vid = 1; uint64 id = 2; }
message GetPredRequest { uint64 vid = 1; }
message Empty {}
message OptionalNodeAddr { optional NodeAddr node = 1; }
message KeyMsg { string key = 1; }
message ValueMsg { string value = 1; }
message KeyValue { string key = 1; string value = 2; }
message PutRequest { string key = 1; string value = 2; }
message BoolMsg { bool ok = 1; }
message NodeAddrList { repeated NodeAddr nodes = 1; }
message NotifyRequest { uint64 vid = 1; optional NodeAddr other = 2; }

message RangeEntry { string key = 1; string value = 2; }
message RangeRequest { string start_key = 1; uint64 count = 2; string caller_address = 3; uint64 model_version = 4; }
message RangeResponse { repeated RangeEntry entries = 1; bool complete = 2; string next_address = 3; }
message RangeForwardRequest {
  string start_key = 1;
  uint64 count = 2;
  string caller_address = 3;
  repeated RangeEntry payload = 4;
  uint64 origin_vid = 5;
  uint64 model_version = 6;
}
message DeliverRangeRequest {
  string caller_address = 1;
  repeated RangeEntry entries = 2;
  bool complete = 3;
}

message ModelParams { uint64 version = 1; bytes data = 2; }
message ModelRequest { string coordinator = 1; }
message HeartbeatMsg { string sender = 1; bool update_ready = 2; uint64 model_version = 3; }
message PutRoutedRequest { string key = 1; string value = 2; }
message KeyList { repeated string keys = 1; }
message LeafDiff {
  uint32 index = 1;
  double weight = 2;
  double bias = 3;
  double anchor_offset = 4;
}
message ModelDiffRequest {
  uint64 active_version = 1;
  string coordinator = 2;
}
message ModelDiff {
  uint64 new_version = 1;
  repeated LeafDiff leaves = 2;
  uint64 n = 3;
}
message ResourceReport {
  uint64 memory_bytes = 1;
  double cpu_percent = 2;
  uint64 key_count = 3;
}
message PruneRequest {
  uint64 vid = 1;
  uint64 target_vid = 2;
  string reason = 3;
}

service Lead {
  rpc FindSuccessor(FindSuccRequest) returns (NodeAddr);
  rpc GetPredecessor(GetPredRequest) returns (OptionalNodeAddr);
  rpc Notify(NotifyRequest) returns (BoolMsg);
  rpc GetLocal(KeyMsg) returns (ValueMsg);
  rpc PutLocal(PutRequest) returns (BoolMsg);
  rpc DeleteLocal(KeyMsg) returns (BoolMsg);
  rpc Ping(Empty) returns (BoolMsg);
  rpc GetSuccessor(VidMsg) returns (NodeAddr);
  rpc GetSuccessorList(VidMsg) returns (NodeAddrList);

  rpc RangeQuery(RangeRequest) returns (RangeResponse);
  rpc RangeForward(RangeForwardRequest) returns (RangeResponse);
  rpc DeliverRange(DeliverRangeRequest) returns (BoolMsg);

  rpc PushModel(ModelParams) returns (BoolMsg);
  rpc RequestModel(ModelRequest) returns (ModelParams);
  rpc GetModelDiff(ModelDiffRequest) returns (ModelDiff);
  rpc Heartbeat(HeartbeatMsg) returns (BoolMsg);
  rpc PutRouted(PutRoutedRequest) returns (BoolMsg);
  rpc GetRouted(KeyMsg) returns (ValueMsg);
  rpc GetKeys(Empty) returns (KeyList);
  rpc ReportResources(ResourceReport) returns (BoolMsg);
  rpc PruneVnode(PruneRequest) returns (BoolMsg);

}
