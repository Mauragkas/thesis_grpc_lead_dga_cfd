services:
  # ---------- LEAD (lead DHT) nodes ----------
  lead-node1:
    build: ./lead
    container_name: lead_node1
    environment:
      - RUST_LOG=info
      - HTTP_BIND=0.0.0.0:2001
      - GRPC_BIND=0.0.0.0:50051
      - SELF_URI=http://lead-node1:50051
      - VIRTUAL_NODE_COUNT=100
    ports:
      - "2001:2001"      # HTTP API (curl testing)
      - "50061:50051"    # gRPC (host-mapped to avoid clash with envoy's 50051)
    depends_on:
      fluent-bit:
        condition: service_healthy
    networks:
      - default
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: lead.node1

  lead-node2:
    build: ./lead
    container_name: lead_node2
    environment:
      - RUST_LOG=info
      - HTTP_BIND=0.0.0.0:2002
      - GRPC_BIND=0.0.0.0:50052
      - SELF_URI=http://lead-node2:50052
      - JOIN_URI=http://lead-node1:50051
      - VIRTUAL_NODE_COUNT=100
    ports:
      - "2002:2002"
    depends_on:
      fluent-bit:
        condition: service_healthy
      lead-node1:
        condition: service_healthy
    networks:
      - default
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: lead.node2

  lead-node3:
    build: ./lead
    container_name: lead_node3
    environment:
      - RUST_LOG=info
      - HTTP_BIND=0.0.0.0:2003
      - GRPC_BIND=0.0.0.0:50053
      - SELF_URI=http://lead-node3:50053
      - JOIN_URI=http://lead-node1:50051
      - VIRTUAL_NODE_COUNT=100
    ports:
      - "2003:2003"
    depends_on:
      fluent-bit:
        condition: service_healthy
      lead-node1:
        condition: service_healthy
    networks:
      - default
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: lead.node3

  # ---------- GA orchestrator ----------
  orchestrator:
    build: ./orchestrator
    environment:
      - RUST_LOG=info
      - RUST_LOG_STYLE=always
      - EVAL_ENDPOINT=load-balancer:50051
      - LEAD_ENDPOINT=http://lead-node1:50051
      - N_WORKERS=${N_WORKERS:-1}
      - GA_SEED=${GA_SEED:-42}
    depends_on:
      fluent-bit:
        condition: service_healthy
      load-balancer:
        condition: service_started
      lead-node1:
        condition: service_started
    restart: "no"
    networks:
      - default
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: orchestrator.main

  # ---------- worker(s) ----------
  worker:
    build: ./worker
    environment:
      - WORKER_ID=${WORKER_ID:-worker}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - V_MIN_FUSE_MM3=20000.0
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      - VECLIB_MAXIMUM_THREADS=1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',50051)); s.close()\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      fluent-bit:
        condition: service_healthy
    networks:
      - default
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: worker.main

  # ---------- Envoy load balancer ----------
  load-balancer:
    image: envoyproxy/envoy:v1.28-latest
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "50051:50051"
    depends_on:
      worker:
        condition: service_healthy
    networks:
      - default

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CLUSTER_ID: loadbalanceGA12345678
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - default

  fluent-bit:
    image: fluent/fluent-bit:3.0
    container_name: fluent-bit
    ports:
      - "24224:24224"
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    healthcheck:
      test: ["CMD", "/fluent-bit/bin/fluent-bit", "--version"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      - kafka
    networks:
      - default

  monitor:
    build: ./monitor
    container_name: monitor
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPICS=logs.lead,logs.orchestrator,logs.worker
      - KAFKA_GROUP_ID=monitor-group
      - PORT=3000
      - BUFFER_CAP=10000
    ports:
      - "3000:3000"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
