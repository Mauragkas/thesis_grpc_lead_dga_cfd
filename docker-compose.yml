services:
  # ---------- LEAD (chord DHT) nodes ----------
  lead-node1:
    build: ./chord_dht
    container_name: lead_node1
    environment:
      - RUST_LOG=info,chord_node=debug
      - HTTP_BIND=0.0.0.0:2001
      - GRPC_BIND=0.0.0.0:50051
      - SELF_URI=http://lead-node1:50051
      - VIRTUAL_NODE_COUNT=10
    ports:
      - "2001:2001"      # HTTP API (curl testing)
      - "50061:50051"    # gRPC (host-mapped to avoid clash with envoy's 50051)
    networks:
      - default

  lead-node2:
    build: ./chord_dht
    container_name: lead_node2
    environment:
      - RUST_LOG=info,chord_node=debug
      - HTTP_BIND=0.0.0.0:2002
      - GRPC_BIND=0.0.0.0:50052
      - SELF_URI=http://lead-node2:50052
      - JOIN_URI=http://lead-node1:50051
      - VIRTUAL_NODE_COUNT=10
    ports:
      - "2002:2002"
    depends_on:
      - lead-node1
    networks:
      - default

  lead-node3:
    build: ./chord_dht
    container_name: lead_node3
    environment:
      - RUST_LOG=info,chord_node=debug
      - HTTP_BIND=0.0.0.0:2003
      - GRPC_BIND=0.0.0.0:50053
      - SELF_URI=http://lead-node3:50053
      - JOIN_URI=http://lead-node1:50051
      - VIRTUAL_NODE_COUNT=10
    ports:
      - "2003:2003"
    depends_on:
      - lead-node1
    networks:
      - default

  # ---------- GA orchestrator ----------
  orchestrator:
    build: ./orchestrator
    environment:
      - RUST_LOG=info,orchestrator=debug
      - RUST_LOG_STYLE=always
      - EVAL_ENDPOINT=load-balancer:50051
      - LEAD_ENDPOINT=http://lead-node1:50051
      - N_WORKERS=${N_WORKERS:-1}
      - GA_SEED=${GA_SEED:-42}
    depends_on:
      load-balancer:
        condition: service_started
      lead-node1:
        condition: service_started
    restart: "no"
    networks:
      - default

  # ---------- worker(s) ----------
  worker:
    build: ./worker
    environment:
      - WORKER_ID=${WORKER_ID:-worker}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - V_MIN_FUSE_MM3=20000.0
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      - VECLIB_MAXIMUM_THREADS=1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',50051)); s.close()\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - default

  # ---------- Envoy load balancer ----------
  load-balancer:
    image: envoyproxy/envoy:v1.28-latest
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "50051:50051"
    depends_on:
      worker:
        condition: service_healthy
    networks:
      - default
