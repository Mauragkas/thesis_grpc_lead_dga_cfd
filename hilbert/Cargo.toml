[package]
name = "hilbert"
version = "0.1.0"
edition = "2021"
description = "Multi-probe Hilbert space-filling curve encoding for order-preserving DHT keys"

[lib]
name = "hilbert_rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"], optional = true }

[features]
default = []
python = ["dep:pyo3"]

[dev-dependencies]
rand = "0.8"
