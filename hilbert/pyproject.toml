[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "hilbert_rs"
version = "0.1.0"
description = "Multi-probe Hilbert space-filling curve encoding for order-preserving DHT keys"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "hilbert_rs"
