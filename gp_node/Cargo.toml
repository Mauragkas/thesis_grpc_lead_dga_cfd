[package]
name = "gp_node"
version = "0.1.0"
edition = "2021"
description = "Gaussian Process surrogate modeling node with C/C++ (CUDA/ROCm/OpenMP) acceleration"

[lib]
name = "gp_node"
path = "src/lib.rs"

[[bin]]
name = "gp_node"
path = "src/main.rs"

[[bin]]
name = "compare"
path = "src/bin/compare.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_chacha = "0.3"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
serial_test = "3.0"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "gp_benchmarks"
harness = false

[build-dependencies]
cc = { version = "1.0", features = ["parallel"] }

[profile.release]
opt-level = 3
lto = "thin"
