services:
  worker:
    build: ../worker
    environment:
      - WORKER_ID=${WORKER_ID:-worker}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - V_MIN_FUSE_MM3=20000.0
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      - VECLIB_MAXIMUM_THREADS=1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',50051)); s.close()\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - default
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: worker.main

  load-balancer:
    image: envoyproxy/envoy:v1.28-latest
    volumes:
      - ../envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "50051:50051"
    depends_on:
      worker:
        condition: service_healthy
    networks:
      - default

  surrogate-node:
    build: ../surrogate_node
    container_name: surrogate_node
    environment:
      - RUST_LOG=info
      - GRPC_BIND=0.0.0.0:50054
      - WINDOW_SIZE=1000
      - RETRAIN_INTERVAL=20
      - MIN_TRAIN_SAMPLES=30
      - MLP_EPOCHS=250
      - MLP_LR=0.001
      - MLP_BATCH_SIZE=32
    ports:
      - "50054:50054"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 50054 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - default
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: surrogate.node

  orchestrator:
    build: ../orchestrator
    environment:
      - RUST_LOG=info
      - RUST_LOG_STYLE=always
      - EVAL_ENDPOINT=load-balancer:50051
      - LEAD_ENDPOINT=http://lead-node1:50051
      - SURROGATE_ENDPOINT=http://surrogate-node:50054
      - TIER_EPSILON_EXACT=0.005
      - TIER_RADIUS_R=0.15
      - TIER_K_NEIGHBORS=15
      - N_WORKERS=${N_WORKERS:-1}
      - GA_SEED=${GA_SEED:-42}
      - RING_BIND=0.0.0.0:50060
      - RING_SELF_ADDRESS=orchestrator:50060
      - MIGRATION_INTERVAL=5
      - MIGRATION_COUNT=3
    ports:
      - "50060:50060"
    depends_on:
      load-balancer:
        condition: service_started
      surrogate-node:
        condition: service_started
    restart: "no"
    networks:
      - default
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: orchestrator.main

networks:
  default:
    external: true
    name: simulated-lan
