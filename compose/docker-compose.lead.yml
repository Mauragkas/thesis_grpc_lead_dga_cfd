services:
  lead-node1:
    build: ../lead
    container_name: lead_node1
    environment:
      - RUST_LOG=info
      - HTTP_BIND=0.0.0.0:2001
      - GRPC_BIND=0.0.0.0:50051
      - SELF_URI=http://lead-node1:50051
      - VIRTUAL_NODE_COUNT=20
    ports:
      - "2001:2001"      # HTTP API (host debugging)
      - "50061:50051"    # gRPC (host-mapped for possible external access)
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:2001/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - default
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: lead.node1

  lead-node2:
    build: ../lead
    container_name: lead_node2
    environment:
      - RUST_LOG=info
      - HTTP_BIND=0.0.0.0:2002
      - GRPC_BIND=0.0.0.0:50052
      - SELF_URI=http://lead-node2:50052
      - JOIN_URI=http://lead-node1:50051
      - VIRTUAL_NODE_COUNT=20
    ports:
      - "2002:2002"
      # optional: map gRPC port for external debugging
      # - "50062:50052"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:2002/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      lead-node1:
        condition: service_healthy
    networks:
      - default
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: lead.node2

  lead-node3:
    build: ../lead
    container_name: lead_node3
    environment:
      - RUST_LOG=info
      - HTTP_BIND=0.0.0.0:2003
      - GRPC_BIND=0.0.0.0:50053
      - SELF_URI=http://lead-node3:50053
      - JOIN_URI=http://lead-node1:50051
      - VIRTUAL_NODE_COUNT=20
    ports:
      - "2003:2003"
      # optional: map gRPC port
      # - "50063:50053"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:2003/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      lead-node1:
        condition: service_healthy
    networks:
      - default
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: lead.node3

networks:
  default:
    external: true
    name: simulated-lan
