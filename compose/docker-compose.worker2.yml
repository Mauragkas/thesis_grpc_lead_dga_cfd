services:
  worker2:
    build: ../worker
    environment:
      - WORKER_ID=${WORKER_ID:-worker2}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - LOG_DIR=/var/log/app
      - V_MIN_FUSE_MM3=20000.0
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      - VECLIB_MAXIMUM_THREADS=1
      - LEAD_ENDPOINT=http://lead-node1:50051   # register with the DHT
    volumes:
      - app-logs:/var/log/app
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=:50051"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - default

  load-balancer2:
    image: envoyproxy/envoy:v1.28-latest
    container_name: load-balancer2
    volumes:
      - ./envoy2.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "50052:50051"           # host-mapped: keep envoy's internal port at 50051,
                                # but expose on a new host port to avoid conflict
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    depends_on:
      worker2:
        condition: service_healthy
    networks:
      - default

  orchestrator2:
    build:
      context: ..
      dockerfile: orchestrator/Dockerfile
    container_name: orchestrator2
    environment:
      - RUST_LOG=info
      - RUST_LOG_STYLE=always
      - LOG_DIR=/var/log/app
      - CONTAINER_NAME=orchestrator2
      - EVAL_ENDPOINT=load-balancer2:50051   # local envoy (same project)
      - LEAD_ENDPOINT=http://lead-node1:50051   # same DHT bootstrap
      - N_WORKERS=${N_WORKERS:-1}
      - GA_SEED=${GA_SEED:-43}               # different seed for varied runs
      # Ring config — joins the first orchestrator
      - RING_BIND=0.0.0.0:50060
      - RING_SELF_ADDRESS=orchestrator2:50060
      - RING_BOOTSTRAP=http://orchestrator:50060
      # Migration config
      - MIGRATION_INTERVAL=5
      - MIGRATION_COUNT=3
    volumes:
      - app-logs:/var/log/app
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 256M
    depends_on:
      load-balancer2:
        condition: service_started
    restart: "no"
    networks:
      - default

volumes:
  app-logs:
    external: true
    name: app-logs

networks:
  default:
    external: true
    name: simulated-lan
