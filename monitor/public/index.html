<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>loadbalanceGA Monitor</title>
  <style>
    /* ── Design tokens ───────────────────────────────────────── */
    :root {
      --bg:         #0f172a;
      --panel:      #1e293b;
      --panel2:     #162032;
      --text:       #e2e8f0;
      --muted:      #64748b;
      --muted2:     #94a3b8;
      --border:     #1e3a5f;
      --accent:     #38bdf8;

      /* log levels */
      --info:   #60a5fa;
      --warn:   #fbbf24;
      --error:  #f87171;
      --debug:  #a78bfa;

      /* per-source colours (left border + tab accent) */
      --src-lead:         #38bdf8;   /* sky blue  */
      --src-orchestrator: #a78bfa;   /* violet    */
      --src-worker:       #4ade80;   /* green     */
      --src-surrogate:    #fb923c;   /* amber     */
      --src-unknown:      #94a3b8;   /* slate     */

      --island-1:         #38bdf8;
      --island-2:         #fb923c;
      --island-3:         #34d399;
      --island-4:         #f472b6;

      --tab-h: 36px;
      --hdr-h: 52px;
      --ctrl-h: 46px;
    }

    /* ── Reset ────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--bg);
      color: var(--text);
      font-size: 12.5px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ──────────────────────────────────────────────── */
    header {
      height: var(--hdr-h);
      min-height: var(--hdr-h);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 18px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .status-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--error);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .status-dot.live { background: #22c55e; }
    header h1 { font-size: 14px; font-weight: 700; white-space: nowrap; }
    .hdr-stats {
      display: flex; gap: 8px; flex-wrap: wrap; margin-left: 4px;
    }
    .stat {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px 8px;
      font-size: 11px;
      white-space: nowrap;
    }
    .stat b { color: var(--accent); }
    .hdr-right {
      margin-left: auto;
      display: flex; align-items: center; gap: 10px;
      font-size: 11px; color: var(--muted2);
    }

    /* ── Controls ────────────────────────────────────────────── */
    .controls {
      height: var(--ctrl-h);
      min-height: var(--ctrl-h);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 18px;
      background: var(--panel2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      flex-wrap: nowrap;
      overflow-x: auto;
    }
    select, input[type="text"], button {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 8px;
      font: inherit;
      height: 26px;
      outline: none;
    }
    select:focus, input[type="text"]:focus { border-color: var(--accent); }
    button { cursor: pointer; white-space: nowrap; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.active { border-color: var(--accent); color: var(--accent); background: rgba(56,189,248,0.08); }
    #search { width: 170px; }
    .ctrl-sep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }
    #count { color: var(--muted2); font-size: 11px; white-space: nowrap; flex-shrink: 0; margin-left: auto; }

    /* ── Source tabs ─────────────────────────────────────────── */
    .tabs {
      height: var(--tab-h);
      min-height: var(--tab-h);
      display: flex;
      align-items: stretch;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      overflow-x: auto;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 14px;
      cursor: pointer;
      border-right: 1px solid var(--border);
      font-size: 11.5px;
      color: var(--muted2);
      user-select: none;
      white-space: nowrap;
      position: relative;
      transition: color 0.15s;
    }
    .tab::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: transparent;
      transition: background 0.15s;
    }
    .tab.active {
      color: var(--text);
      background: var(--panel2);
    }
    .tab.active::after { background: var(--tab-color, var(--accent)); }
    .tab:hover:not(.active) { color: var(--text); background: rgba(255,255,255,0.03); }
    .tab-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--tab-color, var(--accent));
      flex-shrink: 0;
    }
    .badge {
      background: var(--tab-color, var(--accent));
      color: #000;
      border-radius: 10px;
      padding: 0 5px;
      font-size: 10px;
      font-weight: 700;
      min-width: 18px;
      text-align: center;
      opacity: 0.85;
    }

    /* ── Main Workspace (Logs + 3D Plane Split) ─────────────────── */
    #workspace {
      flex: 1;
      display: flex;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }
    #log-area {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0;
      scroll-behavior: auto;
      min-width: 280px;
    }
    #plane-panel {
      width: 500px;
      min-width: 380px;
      max-width: 60vw;
      height: 100%;
      background: var(--panel2);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: relative;
    }
    #plane-panel.hidden {
      display: none;
    }
    .plane-panel-hdr {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      font-size: 11px;
      gap: 6px;
    }
    .plane-hdr-left {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
    }
    .plane-title {
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
    }
    .plane-island-select {
      background: #111c30;
      color: #facc15;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      max-width: 175px;
      height: 24px;
    }
    .plane-island-select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .plane-badge {
      background: #1e3a5f;
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }
    .plane-badge.fit {
      color: #4ade80;
    }
    .plane-hdr-actions {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .plane-hdr-actions button {
      padding: 2px 7px;
      font-size: 10.5px;
      height: 24px;
    }
    #plane-canvas-wrap {
      flex: 1;
      min-height: 200px;
      position: relative;
      background: #090e1a;
      overflow: hidden;
    }
    #plane-canvas-wrap canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    #plane-loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(9, 14, 26, 0.85);
      color: var(--muted2);
      font-size: 11px;
      gap: 8px;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #plane-loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #plane-params-hud {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(30, 58, 95, 0.8);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 9.5px;
      color: var(--muted2);
      pointer-events: none;
      backdrop-filter: blur(4px);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3px 12px;
      line-height: 1.35;
      max-width: 95%;
    }
    .hud-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .hud-label { color: var(--muted); }
    .hud-val { color: var(--accent); font-weight: 700; text-align: right; }

    /* sentinel for IntersectionObserver */
    .sentinel { height: 1px; width: 100%; }

    /* "Load older" banner */
    #older-banner {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px;
      font-size: 11px;
      color: var(--muted2);
      background: var(--panel2);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    #older-banner:hover { color: var(--accent); }
    #older-banner.loading { cursor: default; color: var(--muted); }
    .spinner {
      width: 12px; height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }
    #older-banner.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Log rows ────────────────────────────────────────────── */
    .log-row {
      display: flex;
      align-items: baseline;
      gap: 0;
      border-bottom: 1px solid rgba(30,58,95,0.5);
      border-left: 3px solid transparent;
      padding: 2px 12px 2px 10px;
      line-height: 1.55;
      cursor: pointer;
      transition: background 0.1s;
    }
    .log-row:hover { background: rgba(56,189,248,0.04); }
    .log-row.expanded { background: rgba(56,189,248,0.06); }

    /* source accent stripe */
    .log-row[data-src="logs.lead"]         { border-left-color: var(--src-lead); }
    .log-row[data-src="logs.orchestrator"] { border-left-color: var(--src-orchestrator); }
    .log-row[data-src="logs.worker"]       { border-left-color: var(--src-worker); }
    .log-row[data-src="logs.surrogate"]    { border-left-color: var(--src-surrogate); }

    .col-ts     { width: 95px; flex-shrink: 0; color: var(--muted); font-size: 11px; padding-right: 6px; }
    .col-level  { width: 52px;  flex-shrink: 0; text-align: center; padding-right: 6px; }
    .col-island { width: 62px;  flex-shrink: 0; text-align: center; padding-right: 6px; }
    .col-src    { width: 88px; flex-shrink: 0; font-size: 10.5px; padding-right: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .col-target { width: 160px; flex-shrink: 0; color: var(--muted2); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 8px; }
    .col-msg    { flex: 1; white-space: pre-wrap; word-break: break-all; min-width: 0; }

    .lvl {
      font-size: 10px; font-weight: 700;
      border-radius: 3px;
      padding: 1px 3px;
    }
    .lvl-INFO   { color: var(--info); }
    .lvl-WARN, .lvl-WARNING { color: var(--warn); background: rgba(251,191,36,0.1); }
    .lvl-ERROR, .lvl-CRIT, .lvl-ALERT, .lvl-EMERG { color: var(--error); background: rgba(248,113,113,0.1); }
    .lvl-DEBUG  { color: var(--debug); }

    .isl-badge {
      display: inline-block;
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .isl-badge.isl-2 {
      background: rgba(251, 146, 60, 0.15);
      color: #fb923c;
      border-color: rgba(251, 146, 60, 0.3);
    }
    .isl-badge.isl-3 {
      background: rgba(52, 211, 153, 0.15);
      color: #34d399;
      border-color: rgba(52, 211, 153, 0.3);
    }
    .isl-badge.isl-lead {
      background: rgba(148, 163, 184, 0.15);
      color: #94a3b8;
      border-color: rgba(148, 163, 184, 0.3);
    }

    .col-src-lead         { color: var(--src-lead); }
    .col-src-orchestrator { color: var(--src-orchestrator); }
    .col-src-worker       { color: var(--src-worker); }
    .col-src-surrogate    { color: var(--src-surrogate); }

    /* Expand detail */
    .log-detail {
      display: none;
      background: #0a1628;
      border-left: 3px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 8px 14px;
      margin-left: 0;
    }
    .log-detail.open { display: block; }
    .log-detail pre {
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 11px;
      color: var(--muted2);
      line-height: 1.6;
    }
    .meta-pills {
      display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px;
    }
    .pill {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 10px;
      color: var(--muted2);
    }
    .pill b { color: var(--accent); }

    /* paused overlay */
    #log-area.paused { opacity: 0.65; }
  </style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────── -->
<header>
  <div class="status-dot" id="dot"></div>
  <h1>loadbalanceGA Monitor</h1>
  <div class="hdr-stats" id="hdr-stats"></div>
  <div class="hdr-right">
    <span id="last-event">—</span>
  </div>
</header>

<!-- ── Controls ────────────────────────────────────────────── -->
<div class="controls">
  <select id="ctl-level" title="filter by level">
    <option value="">all levels</option>
    <option value="DEBUG">DEBUG</option>
    <option value="INFO">INFO</option>
    <option value="WARN">WARN</option>
    <option value="ERROR">ERROR</option>
  </select>
  <select id="ctl-island" title="filter by island">
    <option value="">all islands</option>
  </select>
  <select id="ctl-role" title="filter by role">
    <option value="">all roles</option>
    <option value="orchestrator">orchestrators</option>
    <option value="worker">workers</option>
    <option value="surrogate">surrogates</option>
    <option value="lead">lead cluster</option>
  </select>
  <select id="ctl-container" title="filter by container">
    <option value="">all containers</option>
  </select>
  <input id="search" type="text" placeholder="search…" />
  <div class="ctrl-sep"></div>
  <button id="btn-pause">Pause</button>
  <button id="btn-clear">Clear</button>
  <button id="btn-ts-toggle" title="toggle timestamp format">Rel. time</button>
  <button id="btn-export" title="export visible logs as NDJSON">Export NDJSON</button>
  <button id="btn-toggle-3d" class="active" title="Toggle 3D Plane Representation">✈️ 3D Plane</button>
  <span id="count">0 shown</span>
</div>

<!-- ── Source & Island tabs ─────────────────────────────────── -->
<div class="tabs" id="tabs">
  <div class="tab active" data-tab-type="all" data-src="" data-island="" style="--tab-color: var(--accent)">
    <div class="tab-dot"></div>
    All
    <span class="badge" id="badge-all">0</span>
  </div>
  <div class="tab" data-tab-type="src" data-src="logs.lead" data-island="" style="--tab-color: var(--src-lead)">
    <div class="tab-dot"></div>
    lead
    <span class="badge" id="badge-lead">0</span>
  </div>
  <div class="tab" data-tab-type="src" data-src="logs.orchestrator" data-island="" style="--tab-color: var(--src-orchestrator)">
    <div class="tab-dot"></div>
    orchestrator
    <span class="badge" id="badge-orchestrator">0</span>
  </div>
  <div class="tab" data-tab-type="src" data-src="logs.worker" data-island="" style="--tab-color: var(--src-worker)">
    <div class="tab-dot"></div>
    worker
    <span class="badge" id="badge-worker">0</span>
  </div>
  <div class="tab" data-tab-type="src" data-src="logs.surrogate" data-island="" style="--tab-color: var(--src-surrogate)">
    <div class="tab-dot"></div>
    surrogate
    <span class="badge" id="badge-surrogate">0</span>
  </div>
</div>

<!-- ── Workspace (Logs + 3D Plane Split) ───────────────────────── -->
<div id="workspace">
  <!-- Log area -->
  <div id="log-area">
    <!-- top sentinel: when visible → load-older -->
    <div class="sentinel" id="sentinel-top"></div>

    <!-- banner shown while fetching older history -->
    <div id="older-banner">
      <div class="spinner"></div>
      <span id="older-text">↑ Load older logs</span>
    </div>

    <!-- log rows injected here (newest at bottom by default, prepend for older) -->
    <div id="log-list"></div>

    <!-- bottom sentinel: tracks whether user is near bottom (auto-follow) -->
    <div class="sentinel" id="sentinel-bottom"></div>
  </div>

  <!-- 3D Plane Viewer Panel -->
  <div id="plane-panel">
    <div class="plane-panel-hdr">
      <div class="plane-hdr-left">
        <span class="plane-title">✈️ 3D Model</span>
        <select id="plane-island-select" class="plane-island-select" title="Select Candidate View">
          <option value="best" selected>🏆 Best Overall</option>
          <option value="latest">⏱ Latest Received</option>
        </select>
        <span class="plane-badge" id="plane-gen-badge">Gen: —</span>
        <span class="plane-badge fit" id="plane-fit-badge">Best: —</span>
      </div>
      <div class="plane-hdr-actions">
        <button id="btn-wireframe" title="Toggle Wireframe">Wireframe</button>
        <button id="btn-reset-cam" title="Reset Camera View">↺ Reset</button>
        <button id="btn-download-stl" title="Download STL File">⬇ STL</button>
        <button id="btn-close-3d" title="Close 3D View">✕</button>
      </div>
    </div>
    <div id="plane-canvas-wrap">
      <div id="plane-loading-overlay">
        <div style="font-size: 24px;">✈️</div>
        <div>Waiting for candidate genome...</div>
      </div>
    </div>
    <div id="plane-params-hud">
      <!-- HUD injected dynamically -->
    </div>
  </div>
</div>

<!-- ── Script ──────────────────────────────────────────────── -->
<script>
'use strict';

// ── Constants & state ─────────────────────────────────────────
const SOURCE_COLORS = {
  'logs.lead':         'col-src-lead',
  'logs.orchestrator': 'col-src-orchestrator',
  'logs.worker':       'col-src-worker',
  'logs.surrogate':    'col-src-surrogate',
};
const BADGE_IDS = {
  '':                  'badge-all',
  'logs.lead':         'badge-lead',
  'logs.orchestrator': 'badge-orchestrator',
  'logs.worker':       'badge-worker',
  'logs.surrogate':    'badge-surrogate',
};

// All logs in arrival order (newest at end).
const allLogs  = [];
let viewLogs   = [];

let activeSource = '';        // tab filter source
let activeIsland = '';        // tab filter island
let paused       = false;
let relTime      = false;     // relative vs absolute timestamp display
let filter       = {};        // {level, island, role, container, search}

// Auto-scroll: follow bottom unless user has scrolled up
let followBottom = true;

// History cursor
let oldestTs     = null;      // smallest ts we've fetched so far
let loadingOlder = false;
let noMoreOlder  = false;

// Pending live logs to batch-render
let pendingLive  = [];
let rafId        = null;

// Sets for dynamic selectors
const seenContainers = new Set();
const seenIslands    = new Set();

// ── DOM refs ─────────────────────────────────────────────────
const dot          = document.getElementById('dot');
const hdrStats     = document.getElementById('hdr-stats');
const lastEventEl  = document.getElementById('last-event');
const countEl      = document.getElementById('count');
const logList      = document.getElementById('log-list');
const logArea      = document.getElementById('log-area');
const olderBanner  = document.getElementById('older-banner');
const olderText    = document.getElementById('older-text');
const ctlLevel     = document.getElementById('ctl-level');
const ctlIsland    = document.getElementById('ctl-island');
const ctlRole      = document.getElementById('ctl-role');
const ctlContainer = document.getElementById('ctl-container');
const searchEl     = document.getElementById('search');
const tabsBar      = document.getElementById('tabs');

// ── Helpers ───────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

function fmtTs(ts) {
  if (!ts) return '—';
  if (relTime) {
    const diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 60)  return `${diff}s ago`;
    if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
    return `${Math.floor(diff/3600)}h ago`;
  }
  return new Date(ts).toISOString().split('T')[1].slice(0, 12);
}

function levelClass(lvl) {
  const u = String(lvl || '').toUpperCase();
  if (['ERROR','CRIT','ALERT','EMERG'].includes(u)) return 'lvl-ERROR';
  if (['WARN','WARNING'].includes(u)) return 'lvl-WARN';
  if (u === 'DEBUG') return 'lvl-DEBUG';
  return 'lvl-INFO';
}

function srcClass(src) {
  return SOURCE_COLORS[src] || '';
}

function shortSrc(src) {
  const m = { 'logs.lead':'lead', 'logs.orchestrator':'orch.', 'logs.worker':'worker', 'logs.surrogate':'surrogate' };
  return m[src] || src || '—';
}

function extractMsg(log) {
  if (log.message) return log.message;
  if (log.msg) return log.msg;
  if (log.fields?.message) return log.fields.message;
  if (log.fields?.msg) return log.fields.msg;
  if (typeof log.log === 'string' && log.log.trim()) return log.log.trim();
  if (log.raw) return String(log.raw);
  return JSON.stringify(log);
}

// ── Filter logic ─────────────────────────────────────────────
function passesFilter(log) {
  if (activeSource && log.source !== activeSource) return false;
  if (activeIsland && log.island !== activeIsland) return false;
  if (filter.island && log.island !== filter.island) return false;
  if (filter.role && log.role !== filter.role) return false;
  if (filter.level) {
    const want = filter.level.toUpperCase();
    const got  = String(log.level || 'INFO').toUpperCase();
    if (want === 'ERROR') {
      if (!['ERROR','CRIT','ALERT','EMERG'].includes(got)) return false;
    } else if (want === 'WARN') {
      if (!['WARN','WARNING','ERROR','CRIT','ALERT','EMERG'].includes(got)) return false;
    } else if (got !== want) return false;
  }
  if (filter.container && log.source_tag !== filter.container) return false;
  if (filter.search) {
    if (!JSON.stringify(log).toLowerCase().includes(filter.search.toLowerCase())) return false;
  }
  return true;
}

// ── Row rendering ─────────────────────────────────────────────
function makeRow(log) {
  const lvl  = String(log.level || 'INFO').toUpperCase();
  const msg  = extractMsg(log);
  const tgt  = log.target || log.name || log.source_tag || '';
  const src  = log.source || '';
  const islTag = log.island || '—';

  let islClass = 'isl-1';
  if (islTag === 'island-2') islClass = 'isl-2';
  else if (islTag === 'island-3') islClass = 'isl-3';
  else if (islTag === 'lead') islClass = 'isl-lead';
  else if (islTag.startsWith('island-')) islClass = 'isl-' + islTag.replace('island-', '');

  const islText = islTag === 'lead' ? 'LEAD' : (islTag.replace('island-', 'ISL-') || '—');

  // Build meta pills for detail panel
  const pills = [];
  if (log.island)                pills.push(['island', log.island]);
  if (log.role)                  pills.push(['role', log.role]);
  if (log.worker_pool)           pills.push(['pool', log.worker_pool]);
  if (log.source_tag)            pills.push(['container', log.source_tag]);
  if (log.worker_id !== undefined) pills.push(['worker', log.worker_id]);
  if (log.generation !== undefined) pills.push(['gen', log.generation]);
  if (log.offset !== undefined)  pills.push(['offset', log.offset]);
  if (log.partition !== undefined) pills.push(['part', log.partition]);

  // Clean detail JSON
  const detail = Object.fromEntries(
    Object.entries(log).filter(([k]) => !['source','partition','offset'].includes(k))
  );

  const row = document.createElement('div');
  row.className = 'log-row';
  row.dataset.src = src;
  row.innerHTML = `
    <span class="col-ts">${escHtml(fmtTs(log.ts))}</span>
    <span class="col-level"><span class="lvl ${levelClass(lvl)}">${escHtml(lvl || '—')}</span></span>
    <span class="col-island"><span class="isl-badge ${islClass}">${escHtml(islText)}</span></span>
    <span class="col-src ${srcClass(src)}">${escHtml(shortSrc(src))}</span>
    <span class="col-target" title="${escHtml(tgt)}">${escHtml(tgt)}</span>
    <span class="col-msg">${escHtml(msg)}</span>
  `;

  // Detail panel (hidden until click)
  const detail_el = document.createElement('div');
  detail_el.className = 'log-detail';
  detail_el.innerHTML = `
    <div class="meta-pills">
      ${pills.map(([k,v]) => `<span class="pill"><b>${escHtml(k)}</b> ${escHtml(String(v))}</span>`).join('')}
      <span class="pill"><b>ts</b> ${escHtml(new Date(log.ts||0).toISOString())}</span>
      <span class="pill"><b>src</b> ${escHtml(src)}</span>
    </div>
    <pre>${escHtml(JSON.stringify(detail, null, 2))}</pre>
  `;

  // Click to expand/collapse
  row.addEventListener('click', () => {
    const open = detail_el.classList.toggle('open');
    row.classList.toggle('expanded', open);
  });

  const wrap = document.createElement('div');
  wrap.appendChild(row);
  wrap.appendChild(detail_el);
  return wrap;
}

// ── Render helpers ────────────────────────────────────────────
function rebuildView() {
  viewLogs = allLogs.filter(passesFilter);
  const frag = document.createDocumentFragment();
  for (const log of viewLogs) frag.appendChild(makeRow(log));
  logList.replaceChildren(frag);
  updateCount();
  if (followBottom) scrollToBottom();
}

function prependOlderRows(logs) {
  const frag = document.createDocumentFragment();
  const ordered = [...logs].reverse();
  for (const log of ordered) frag.appendChild(makeRow(log));
  logList.prepend(frag);
  updateCount();
}

function appendLiveRows(logs) {
  const frag = document.createDocumentFragment();
  for (const log of logs) frag.appendChild(makeRow(log));
  logList.appendChild(frag);
  updateCount();
  if (followBottom) scrollToBottom();
}

function updateCount() {
  const total = logList.children.length;
  countEl.textContent = `${total} shown`;
}

function scrollToBottom() {
  logArea.scrollTop = logArea.scrollHeight;
}

// ── Dynamic Selectors ─────────────────────────────────────────
function refreshIslandDropdown() {
  const current = ctlIsland.value;
  ctlIsland.innerHTML = '<option value="">all islands</option>';
  for (const isl of [...seenIslands].sort()) {
    const opt = document.createElement('option');
    opt.value = isl;
    opt.textContent = isl.replace('-', ' ').replace(/\b\w/g, c => c.toUpperCase());
    if (isl === current) opt.selected = true;
    ctlIsland.appendChild(opt);
  }
  updateIslandTabs();
}

function refreshContainerDropdown() {
  const current = ctlContainer.value;
  ctlContainer.innerHTML = '<option value="">all containers</option>';
  for (const c of [...seenContainers].sort()) {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = c;
    if (c === current) opt.selected = true;
    ctlContainer.appendChild(opt);
  }
}

function updateIslandTabs() {
  for (const isl of [...seenIslands].sort()) {
    const tabId = `tab-${isl}`;
    let tab = document.getElementById(tabId);
    if (!tab) {
      tab = document.createElement('div');
      tab.id = tabId;
      tab.className = 'tab';
      tab.dataset.tabType = 'island';
      tab.dataset.island = isl;
      tab.dataset.src = '';
      const color = isl === 'island-2' ? 'var(--island-2)' : isl === 'island-3' ? 'var(--island-3)' : 'var(--island-1)';
      tab.style.setProperty('--tab-color', color);
      const label = isl.replace('-', ' ').replace(/\b\w/g, c => c.toUpperCase());
      tab.innerHTML = `
        <div class="tab-dot"></div>
        ${escHtml(label)}
        <span class="badge" id="badge-${isl}">0</span>
      `;
      tabsBar.appendChild(tab);
    }
  }
}

// ── Batched live render ───────────────────────────────────────
function scheduleRender() {
  if (rafId !== null) return;
  rafId = requestAnimationFrame(() => {
    rafId = null;
    if (paused || pendingLive.length === 0) return;
    const passing = pendingLive.filter(passesFilter);
    pendingLive = [];
    if (passing.length > 0) {
      viewLogs.push(...passing);
      appendLiveRows(passing);
    }
  });
}

function addLiveLogs(logs) {
  allLogs.push(...logs);
  let islandsChanged = false;
  let containersChanged = false;

  for (const l of logs) {
    if (l.ts && (oldestTs === null || l.ts < oldestTs)) oldestTs = l.ts;

    if (l.island && l.island !== 'lead' && l.island !== 'default' && !seenIslands.has(l.island)) {
      seenIslands.add(l.island);
      islandsChanged = true;
    }

    if (l.source_tag && !seenContainers.has(l.source_tag)) {
      seenContainers.add(l.source_tag);
      containersChanged = true;
    }
  }

  if (islandsChanged) refreshIslandDropdown();
  if (containersChanged) refreshContainerDropdown();

  if (paused) return;
  pendingLive.push(...logs);
  scheduleRender();
}

// ── Stats rendering ───────────────────────────────────────────
function renderStats(s) {
  const parts = [];
  parts.push(`<span class="stat">total <b>${s.total ?? '—'}</b></span>`);
  for (const [src, n] of Object.entries(s.bySource || {})) {
    const short = src.replace('logs.', '');
    parts.push(`<span class="stat">${escHtml(short)} <b>${n}</b></span>`);
  }
  hdrStats.innerHTML = parts.join('');

  // Update badges
  document.getElementById('badge-all').textContent = s.total ?? 0;
  for (const [src, id] of Object.entries(BADGE_IDS)) {
    if (src === '') continue;
    const el = document.getElementById(id);
    if (el) el.textContent = s.bySource?.[src] ?? 0;
  }

  if (Array.isArray(s.islands)) {
    let changed = false;
    for (const isl of s.islands) {
      if (!seenIslands.has(isl)) {
        seenIslands.add(isl);
        changed = true;
      }
    }
    if (changed) refreshIslandDropdown();
  }
}

// ── Cursor-based history fetching ─────────────────────────────
async function loadOlder() {
  if (loadingOlder || noMoreOlder || oldestTs === null) return;
  loadingOlder = true;
  olderBanner.classList.add('loading');
  olderText.textContent = 'Loading…';

  const before = oldestTs;
  if (ws && ws.readyState === ws.OPEN) {
    const req = {
      type:      'history',
      before,
      source:    activeSource || undefined,
      island:    (activeIsland || filter.island) || undefined,
      role:      filter.role   || undefined,
      container: filter.container || undefined,
      level:     filter.level  || undefined,
      search:    filter.search || undefined,
      limit:     100,
    };
    ws.send(JSON.stringify(req));
  } else {
    try {
      const params = new URLSearchParams({
        before: String(before),
        limit:  '100',
      });
      if (activeSource)     params.set('source', activeSource);
      if (activeIsland || filter.island) params.set('island', activeIsland || filter.island);
      if (filter.role)      params.set('role', filter.role);
      if (filter.level)     params.set('level', filter.level);
      if (filter.container) params.set('container', filter.container);
      if (filter.search)    params.set('search', filter.search);

      const res = await fetch(`/logs/history?${params}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      onHistoryChunk(data);
    } catch (err) {
      console.warn('history fetch failed:', err);
      loadingOlder = false;
      olderBanner.classList.remove('loading');
      olderText.textContent = '↑ Load older logs (failed, click to retry)';
    }
  }
}

function onHistoryChunk({ logs, hasMore }) {
  loadingOlder = false;
  olderBanner.classList.remove('loading');

  if (!logs || logs.length === 0) {
    noMoreOlder = true;
    olderText.textContent = '— no older logs —';
    return;
  }

  const scrollHBefore = logArea.scrollHeight;
  const scrollTBefore = logArea.scrollTop;

  allLogs.unshift(...[...logs].reverse());

  for (const l of logs) {
    if (l.ts && (oldestTs === null || l.ts < oldestTs)) oldestTs = l.ts;
  }

  const passing = logs.filter(passesFilter);
  if (passing.length > 0) {
    viewLogs.unshift(...[...passing].reverse());
    prependOlderRows(passing);
    logArea.scrollTop = scrollTBefore + (logArea.scrollHeight - scrollHBefore);
  }

  if (!hasMore) {
    noMoreOlder = true;
  }
  olderText.textContent = noMoreOlder ? '— no older logs —' : '↑ Load older logs';
}

// ── Filter change handling ────────────────────────────────────
function applyFilter() {
  filter = {
    level:     ctlLevel.value     || undefined,
    island:    ctlIsland.value    || undefined,
    role:      ctlRole.value      || undefined,
    container: ctlContainer.value || undefined,
    search:    searchEl.value     || undefined,
  };
  sendWsFilter();
  noMoreOlder = false;
  rebuildView();
}

function debounce(fn, ms) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}
const applyFilterDebounced = debounce(applyFilter, 280);

ctlLevel.addEventListener('change', applyFilter);
ctlIsland.addEventListener('change', (e) => {
  activeIsland = e.target.value || '';
  document.querySelectorAll('.tab').forEach(t => {
    if (t.dataset.tabType === 'island') {
      t.classList.toggle('active', t.dataset.island === activeIsland);
    } else if (t.dataset.tabType === 'all') {
      t.classList.toggle('active', !activeIsland && !activeSource);
    }
  });
  applyFilter();
});
ctlRole.addEventListener('change', applyFilter);
ctlContainer.addEventListener('change', applyFilter);
searchEl.addEventListener('input', applyFilterDebounced);

// ── Tabs ──────────────────────────────────────────────────────
tabsBar.addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');

  const tabType = tab.dataset.tabType || 'src';
  if (tabType === 'island') {
    activeIsland = tab.dataset.island || '';
    activeSource = '';
    ctlIsland.value = activeIsland;
  } else if (tabType === 'src') {
    activeSource = tab.dataset.src || '';
    activeIsland = '';
    ctlIsland.value = '';
  } else {
    activeSource = '';
    activeIsland = '';
    ctlIsland.value = '';
  }

  noMoreOlder = false;
  rebuildView();
  sendWsFilter();
});

// ── Buttons ───────────────────────────────────────────────────
document.getElementById('btn-pause').addEventListener('click', (e) => {
  paused = !paused;
  e.target.textContent = paused ? 'Resume' : 'Pause';
  e.target.classList.toggle('active', paused);
  logArea.classList.toggle('paused', paused);
  if (!paused) {
    const passing = pendingLive.filter(passesFilter);
    pendingLive = [];
    if (passing.length) {
      viewLogs.push(...passing);
      appendLiveRows(passing);
    }
  }
});

document.getElementById('btn-clear').addEventListener('click', () => {
  allLogs.length = 0;
  viewLogs.length = 0;
  pendingLive = [];
  oldestTs = null;
  noMoreOlder = false;
  logList.replaceChildren();
  updateCount();
});

document.getElementById('btn-ts-toggle').addEventListener('click', (e) => {
  relTime = !relTime;
  e.target.classList.toggle('active', relTime);
  const spans = logList.querySelectorAll('.col-ts');
  const children = Array.from(logList.children);
  children.forEach((wrap, i) => {
    const log = viewLogs[i];
    if (!log) return;
    const span = wrap.querySelector('.col-ts');
    if (span) span.textContent = fmtTs(log.ts);
  });
});

setInterval(() => {
  if (!relTime) return;
  const children = Array.from(logList.children);
  children.forEach((wrap, i) => {
    const log = viewLogs[i];
    if (!log) return;
    const span = wrap.querySelector('.col-ts');
    if (span) span.textContent = fmtTs(log.ts);
  });
}, 10000);

document.getElementById('btn-export').addEventListener('click', () => {
  const lines = viewLogs.map(l => JSON.stringify(l)).join('\n');
  const blob = new Blob([lines], { type: 'application/x-ndjson' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `monitor-export-${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.ndjson`;
  a.click();
  URL.revokeObjectURL(url);
});

// ── WS filter push ───────────────────────────────────────────
function sendWsFilter() {
  if (!ws || ws.readyState !== ws.OPEN) return;
  const wsFilter = {
    source:    activeSource || undefined,
    island:    (activeIsland || filter.island) || undefined,
    role:      filter.role      || undefined,
    level:     filter.level     || undefined,
    container: filter.container || undefined,
    search:    filter.search    || undefined,
  };
  ws.send(JSON.stringify({ type: 'filter', filter: wsFilter }));
}

// ── IntersectionObserver (auto-follow + load-older) ───────────
const bottomObs = new IntersectionObserver((entries) => {
  followBottom = entries[0].isIntersecting;
}, { root: logArea, threshold: 0.1 });
bottomObs.observe(document.getElementById('sentinel-bottom'));

const topObs = new IntersectionObserver((entries) => {
  const visible = entries[0].isIntersecting;
  olderBanner.style.display = visible ? 'flex' : 'none';
  if (visible && !loadingOlder && !noMoreOlder && oldestTs !== null) {
    loadOlder();
  }
}, { root: logArea, threshold: 0.5 });
topObs.observe(document.getElementById('sentinel-top'));

olderBanner.addEventListener('click', () => {
  if (!loadingOlder && !noMoreOlder) loadOlder();
});

// ── WebSocket transport ───────────────────────────────────────
let ws = null;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/stream`);

  ws.onopen = () => {
    dot.classList.add('live');
    sendWsFilter();
  };

  ws.onmessage = (event) => {
    let msg;
    try {
      msg = JSON.parse(event.data);
    } catch {
      return;
    }

    lastEventEl.textContent = new Date().toLocaleTimeString();

    if (msg.type === 'hello' || msg.type === 'ack' || msg.type === 'pong') return;

    if (msg.type === 'stats') {
      renderStats(msg);
      return;
    }

    if (msg.type === 'history_chunk') {
      onHistoryChunk(msg);
      return;
    }

    if (msg.type === 'candidates') {
      if (typeof window.onCandidatesInitial === 'function') {
        window.onCandidatesInitial(msg);
      }
      return;
    }

    if (msg.type === 'candidate') {
      window.onCandidateUpdate?.(msg.candidate, msg.isBest, msg.bestOverall);
      return;
    }

    // Live log
    if (msg.candidate) {
      window.onCandidateUpdate?.(msg.candidate);
    }
    addLiveLogs([msg]);
  };

  ws.onclose = () => {
    dot.classList.remove('live');
    setTimeout(connect, 2000);
  };
  ws.onerror = () => ws.close();
}

// ── Bootstrap ─────────────────────────────────────────────────
connect();
</script>

<script type="importmap">

</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let scene, camera, renderer, controls, planeMeshGroup;
let isWireframe = false;
let currentCandidate = null;

// Multi-island and Best Candidate state
let selectedPlaneMode = 'best'; // 'best' (default) | 'latest' | island ID (e.g. 'island-1')
let bestOverallCandidate = null;
let latestCandidateOverall = null;
const islandLatestCandidates = {}; // island -> candidate
const islandBestCandidates = {};   // island -> candidate

const planeIslandSelect = document.getElementById('plane-island-select');

function parseCandidateFit(cand) {
  if (!cand) return -Infinity;
  if (cand.fitness !== null && cand.fitness !== undefined && !Number.isNaN(Number(cand.fitness))) {
    return Number(cand.fitness);
  }
  return -Infinity;
}

function init3DViewer() {
  const container = document.getElementById('plane-canvas-wrap');
  if (!container) return;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x090e1a);

  // Camera
  const width = container.clientWidth || 400;
  const height = container.clientHeight || 300;
  camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 2000);
  camera.position.set(220, 200, 280);

  // WebGL Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  // Controls
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.target.set(130, 0, 0);

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
  scene.add(ambientLight);

  const sunLight1 = new THREE.DirectionalLight(0x38bdf8, 1.4);
  sunLight1.position.set(250, 350, 250);
  scene.add(sunLight1);

  const fillLight = new THREE.DirectionalLight(0xffedd5, 0.85);
  fillLight.position.set(-200, -200, -150);
  scene.add(fillLight);

  // Floor grid & axes
  const gridHelper = new THREE.GridHelper(600, 24, 0x1e3a5f, 0x111c30);
  gridHelper.position.set(130, -45, 0);
  scene.add(gridHelper);

  const axesHelper = new THREE.AxesHelper(60);
  axesHelper.position.set(0, -45, 0);
  scene.add(axesHelper);

  planeMeshGroup = new THREE.Group();
  scene.add(planeMeshGroup);

  // Resize handling
  window.addEventListener('resize', onWindowResize);
  const ro = new ResizeObserver(() => onWindowResize());
  ro.observe(container);

  // Render loop
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // Initial candidate fetch: prioritize Best Overall candidate
  fetch('/api/candidate/best')
    .then((r) => (r.ok ? r.json() : null))
    .then((best) => {
      if (best) {
        bestOverallCandidate = best;
        handleNewCandidate(best, true);
      }
    })
    .catch(() => {});

  // Fetch all per-island best candidates
  fetch('/api/candidates/best')
    .then((r) => (r.ok ? r.json() : {}))
    .then((map) => {
      if (map) {
        Object.assign(islandBestCandidates, map);
        refreshPlaneIslandOptions();
        if (selectedPlaneMode === 'best' && !bestOverallCandidate) {
          for (const cand of Object.values(islandBestCandidates)) {
            if (!bestOverallCandidate || parseCandidateFit(cand) >= parseCandidateFit(bestOverallCandidate)) {
              bestOverallCandidate = cand;
            }
          }
          if (bestOverallCandidate) updatePlane3D(bestOverallCandidate, '🏆 Best Overall');
        }
      }
    })
    .catch(() => {});
}

function onWindowResize() {
  const container = document.getElementById('plane-canvas-wrap');
  if (!container || !renderer || !camera) return;
  const width = container.clientWidth;
  const height = container.clientHeight;
  if (width === 0 || height === 0) return;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
}

function refreshPlaneIslandOptions() {
  if (!planeIslandSelect) return;
  const current = selectedPlaneMode;

  let bestFitText = '';
  if (bestOverallCandidate && bestOverallCandidate.fitness !== null && bestOverallCandidate.fitness !== undefined) {
    const fitVal = Number(bestOverallCandidate.fitness).toFixed(1);
    const islName = bestOverallCandidate.island || 'isl-1';
    bestFitText = ` (${fitVal} [${islName}])`;
  }

  let html = `<option value="best">🏆 Best Overall${bestFitText}</option>`;
  html += `<option value="latest">⏱ Latest Received</option>`;

  const islands = Array.from(new Set([
    ...Object.keys(islandBestCandidates),
    ...Object.keys(islandLatestCandidates)
  ])).sort();

  for (const isl of islands) {
    const cand = islandBestCandidates[isl] || islandLatestCandidates[isl];
    const name = isl.replace('-', ' ').replace(/\b\w/g, c => c.toUpperCase());
    const fitStr = cand && cand.fitness !== null && cand.fitness !== undefined
      ? ` (Best: ${Number(cand.fitness).toFixed(1)})`
      : '';
    html += `<option value="${isl}">${name}${fitStr}</option>`;
  }

  planeIslandSelect.innerHTML = html;
  planeIslandSelect.value = current;
}

function handleNewCandidate(candidate, isBestExplicit, bestOverallExplicit) {
  if (!candidate) return;
  const isl = candidate.island || 'island-1';
  islandLatestCandidates[isl] = candidate;
  latestCandidateOverall = candidate;

  const candFit = parseCandidateFit(candidate);
  const prevBestIsland = islandBestCandidates[isl];
  if (!prevBestIsland || candFit >= parseCandidateFit(prevBestIsland)) {
    islandBestCandidates[isl] = candidate;
  }

  if (bestOverallExplicit) {
    bestOverallCandidate = bestOverallExplicit;
  } else if (isBestExplicit || !bestOverallCandidate || candFit >= parseCandidateFit(bestOverallCandidate)) {
    bestOverallCandidate = candidate;
  }

  refreshPlaneIslandOptions();

  // Render logic based on user selected mode:
  if (selectedPlaneMode === 'best') {
    if (bestOverallCandidate) {
      updatePlane3D(bestOverallCandidate, '🏆 Best Overall');
    }
  } else if (selectedPlaneMode === 'latest') {
    updatePlane3D(candidate, `⏱ Latest [${isl}]`);
  } else if (selectedPlaneMode === isl) {
    const islBest = islandBestCandidates[isl] || candidate;
    updatePlane3D(islBest, `Best [${isl}]`);
  }
}

planeIslandSelect?.addEventListener('change', (e) => {
  selectedPlaneMode = e.target.value;
  if (selectedPlaneMode === 'best') {
    if (bestOverallCandidate) updatePlane3D(bestOverallCandidate, '🏆 Best Overall');
  } else if (selectedPlaneMode === 'latest') {
    if (latestCandidateOverall) updatePlane3D(latestCandidateOverall, '⏱ Latest Received');
  } else if (islandBestCandidates[selectedPlaneMode]) {
    updatePlane3D(islandBestCandidates[selectedPlaneMode], `Best [${selectedPlaneMode}]`);
  } else if (islandLatestCandidates[selectedPlaneMode]) {
    updatePlane3D(islandLatestCandidates[selectedPlaneMode], `[${selectedPlaneMode}]`);
  }
});

function updatePlane3D(candidate, modeLabel = '') {
  if (!candidate) return;
  currentCandidate = candidate;

  // Hide loading overlay
  const overlay = document.getElementById('plane-loading-overlay');
  if (overlay) overlay.classList.add('hidden');

  // Update header badges
  const genBadge = document.getElementById('plane-gen-badge');
  const fitBadge = document.getElementById('plane-fit-badge');
  const islPrefix = candidate.island ? `[${candidate.island}] ` : '';
  const labelPrefix = modeLabel ? `${modeLabel} ` : '';

  if (genBadge) genBadge.textContent = `${labelPrefix}${islPrefix}Gen: ${candidate.gen ?? '—'}`;
  if (fitBadge) {
    if (candidate.fitness !== null && candidate.fitness !== undefined) {
      fitBadge.textContent = `Fit: ${Number(candidate.fitness).toFixed(2)}`;
    } else {
      fitBadge.textContent = 'Fit: —';
    }
  }

  // Decode parameters
  let params;
  if (candidate.decoded) {
    params = candidate.decoded;
  } else if (Array.isArray(candidate.genome)) {
    params = window.PlaneGeometry.decodeGenes(candidate.genome);
  } else {
    return;
  }

  // Update HUD
  renderParamsHud(params);

  // Build mesh
  const rawMesh = window.PlaneGeometry.buildPlaneMesh(params);

  // Clear previous meshes
  while (planeMeshGroup.children.length > 0) {
    const obj = planeMeshGroup.children.pop();
    if (obj.geometry) obj.geometry.dispose();
  }

  // Construct Three.js BufferGeometry
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(rawMesh.positions, 3));
  geometry.setIndex(new THREE.BufferAttribute(rawMesh.indices, 1));
  geometry.computeVertexNormals();

  const islColor = candidate.island === 'island-2' ? 0xfb923c : 0xfacc15;
  const material = new THREE.MeshStandardMaterial({
    color: islColor,
    roughness: 0.32,
    metalness: 0.2,
    wireframe: isWireframe,
    side: THREE.DoubleSide,
  });

  const mesh = new THREE.Mesh(geometry, material);
  planeMeshGroup.add(mesh);

  // Reposition target to fuselage midpoint
  const midX = (params.fuse_length || 250) / 2;
  controls.target.set(midX, 0, 0);
}

function renderParamsHud(p) {
  const hud = document.getElementById('plane-params-hud');
  if (!hud || !p) return;
  hud.innerHTML = `
    <div class="hud-row"><span class="hud-label">Wingspan (b)</span><span class="hud-val">${(p.wing_span * 2).toFixed(1)} mm</span></div>
    <div class="hud-row"><span class="hud-label">Root Chord</span><span class="hud-val">${p.wing_root_chord.toFixed(1)} mm</span></div>
    <div class="hud-row"><span class="hud-label">Tip Chord</span><span class="hud-val">${p.wing_tip_chord.toFixed(1)} mm</span></div>
    <div class="hud-row"><span class="hud-label">Sweep (LE)</span><span class="hud-val">${p.wing_sweep.toFixed(1)}°</span></div>
    <div class="hud-row"><span class="hud-label">Dihedral</span><span class="hud-val">${p.wing_dihedral.toFixed(1)}°</span></div>
    <div class="hud-row"><span class="hud-label">Tip Twist</span><span class="hud-val">${p.wing_twist >= 0 ? '+' : ''}${p.wing_twist.toFixed(1)}°</span></div>
    <div class="hud-row"><span class="hud-label">Wing Pos (X)</span><span class="hud-val">${p.wing_x_pos.toFixed(1)} mm</span></div>
    <div class="hud-row"><span class="hud-label">Airfoil</span><span class="hud-val">NACA ${Math.round(p.naca_m)}${Math.round(p.naca_p)}${Math.round(p.naca_t)}</span></div>
    <div class="hud-row"><span class="hud-label">Fuselage Length</span><span class="hud-val">${p.fuse_length.toFixed(1)} mm</span></div>
    <div class="hud-row"><span class="hud-label">Fuselage Diam.</span><span class="hud-val">${p.fuse_max_diam.toFixed(1)} mm</span></div>
  `;
}

// Global hooks for websocket handler
window.onCandidateUpdate = (candidate, isBest, bestOverall) => {
  handleNewCandidate(candidate, isBest, bestOverall);
};

window.onCandidatesInitial = ({ candidates, bestCandidates, bestOverall }) => {
  if (candidates) {
    Object.assign(islandLatestCandidates, candidates);
  }
  if (bestCandidates) {
    Object.assign(islandBestCandidates, bestCandidates);
  }
  if (bestOverall) {
    bestOverallCandidate = bestOverall;
  } else {
    for (const cand of Object.values(islandBestCandidates)) {
      if (!bestOverallCandidate || parseCandidateFit(cand) >= parseCandidateFit(bestOverallCandidate)) {
        bestOverallCandidate = cand;
      }
    }
  }
  refreshPlaneIslandOptions();
  if (selectedPlaneMode === 'best' && bestOverallCandidate) {
    updatePlane3D(bestOverallCandidate, '🏆 Best Overall');
  }
};

// Button handlers
document.getElementById('btn-wireframe')?.addEventListener('click', (e) => {
  isWireframe = !isWireframe;
  e.target.classList.toggle('active', isWireframe);
  if (planeMeshGroup && planeMeshGroup.children[0]) {
    planeMeshGroup.children[0].material.wireframe = isWireframe;
  }
});

document.getElementById('btn-reset-cam')?.addEventListener('click', () => {
  if (!camera || !controls) return;
  const p = currentCandidate?.decoded || window.PlaneGeometry?.BASELINE;
  const midX = p ? p.fuse_length / 2 : 130;
  controls.target.set(midX, 0, 0);
  camera.position.set(midX + 100, 180, 280);
  controls.update();
});

document.getElementById('btn-download-stl')?.addEventListener('click', () => {
  if (!currentCandidate) {
    const baselineParams = window.PlaneGeometry.BASELINE;
    const mesh = window.PlaneGeometry.buildPlaneMesh(baselineParams);
    const stlStr = window.PlaneGeometry.meshToSTL(mesh, 'aircraft_baseline');
    downloadStlFile(stlStr, 'aircraft_baseline.stl');
    return;
  }
  const params = currentCandidate.decoded || window.PlaneGeometry.decodeGenes(currentCandidate.genome);
  const mesh = window.PlaneGeometry.buildPlaneMesh(params);
  const genNum = currentCandidate.gen ?? 0;
  const isl = currentCandidate.island || 'overall';
  const isBest = currentCandidate === bestOverallCandidate;
  const prefix = isBest ? 'best_overall_' : '';
  const stlStr = window.PlaneGeometry.meshToSTL(mesh, `${prefix}aircraft_${isl}_gen_${genNum}`);
  downloadStlFile(stlStr, `${prefix}candidate_${isl}_gen_${genNum}.stl`);
});

function downloadStlFile(stlStr, filename) {
  const blob = new Blob([stlStr], { type: 'model/stl' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

// Toggle 3D panel button
const btn3d = document.getElementById('btn-toggle-3d');
const planePanel = document.getElementById('plane-panel');
const btnClose3d = document.getElementById('btn-close-3d');

function toggle3D(show) {
  const isHidden = planePanel.classList.toggle(
    'hidden',
    typeof show === 'boolean' ? !show : undefined
  );
  if (btn3d) btn3d.classList.toggle('active', !isHidden);
  setTimeout(() => onWindowResize(), 150);
}

btn3d?.addEventListener('click', () => toggle3D());
btnClose3d?.addEventListener('click', () => toggle3D(false));

// Initialize viewer once DOM ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init3DViewer);
} else {
  init3DViewer();
}
</script>
</body>
